[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfoliomcp"
version = "0.1.0"
description = "AgentCore MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp >= 1.19.0",
    "boto3 (>=1.43.36,<2.0.0)",
    "langchain-aws (>=1.6.1,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.6,<2.0.0)",
    "bedrock-agentcore (>=1.15.1,<2.0.0)"
]

[tool.hatch.build.targets.wheel]
packages = ["."]
